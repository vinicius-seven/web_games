<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jogateca</title>
  <meta name="description" content="Jogateca — um catálogo de jogos de navegador para jogar na hora.">
  <meta name="theme-color" content="#0b0b0f">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jogateca">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="logo" href="./" aria-label="Jogateca, início">JOGATECA</a>
    <nav class="nav" aria-label="Seções">
      <a href="#row-jogar">Início</a>
      <a href="#row-em-breve" id="navBreve">Em breve</a>
      <a href="#row-minha-lista" id="navLista" hidden>Minha lista</a>
    </nav>
    <button class="install-btn" data-pwa-install hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M11 3h2v9.6l3.3-3.3 1.4 1.4L12 16.4l-5.7-5.7 1.4-1.4 3.3 3.3V3zM5 18h14v2H5z"/></svg>
      <span>Instalar app</span>
    </button>
  </header>

  <main>
    <section class="hero" id="hero" aria-label="Destaque"></section>
    <div class="rows" id="rows"></div>
  </main>

  <footer class="footer">
    <p>Jogateca · jogos de navegador, sem instalar nada.</p>
    <p class="muted">Seus recordes ficam salvos só neste navegador.</p>
  </footer>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" data-close aria-label="Fechar">✕</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
