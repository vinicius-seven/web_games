<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Prensa · Jogateca</title>
  <meta name="description" content="Prensa — descubra a palavra de cinco letras. Uma, duas ou quatro palavras por dia, e um modo livre.">
  <meta name="theme-color" content="#231a14">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e3c68f'/%3E%3Ctext x='16' y='24' font-family='Georgia,serif' font-weight='700' font-size='22' text-anchor='middle' fill='%232f7d4f'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jogateca">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="prensa.css">
</head>
<body>
  <header class="bar">
    <span class="bar-left"><a href="../../index.html" class="back">‹ Jogateca</a></span>
    <h1 class="brand">PRENSA</h1>
    <span class="bar-right">
      <button class="icon-btn" id="helpBtn" aria-label="Como jogar"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 18h2v-2h-2v2zm1-16a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm0-14a4 4 0 0 0-4 4h2a2 2 0 1 1 4 0c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5a4 4 0 0 0-4-4z"/></svg></button>
      <button class="icon-btn" id="statsBtn" aria-label="Estatísticas"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 20h4V10H4v10zm6 0h4V4h-4v16zm6 0h4v-7h-4v7z"/></svg></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
    </span>
  </header>

  <main class="game">
    <nav class="modes" role="tablist" aria-label="Modo de jogo">
      <button role="tab" data-mode="um">1 palavra</button>
      <button role="tab" data-mode="dois">2 palavras</button>
      <button role="tab" data-mode="quatro">4 palavras</button>
      <button role="tab" data-mode="livre">Livre</button>
    </nav>
    <div class="boards" id="boards" aria-live="polite"></div>
    <div class="keyboard" id="keyboard" aria-label="Teclado"></div>
  </main>

  <div class="toasts" id="toasts" role="status" aria-live="assertive"></div>

  <!-- Janelas -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" data-close aria-label="Fechar">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="palavras.js"></script>
  <script src="prensa.js"></script>
  <script src="../../pwa.js"></script>
</body>
</html>
